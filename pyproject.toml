[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-insight-mcp"
version = "0.1.0"
description = "MCP server giving agents read-only, structured access to a GitHub repository"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Virad Mathur", email = "viradm@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "github", "agents", "llm"]
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
repo-insight-mcp = "repo_insight_mcp.server:main"

[project.urls]
Repository = "https://github.com/viradm/repo-insight-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_insight_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
